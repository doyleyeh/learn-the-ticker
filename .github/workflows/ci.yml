name: CI
on: [push, pull_request]
jobs:
  quality:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - if: runner.os == 'Windows'
        run: ./scripts/run_quality_gate.ps1
      - if: runner.os != 'Windows'
        run: bash scripts/run_quality_gate.sh
      - name: Verify generated contracts
        run: |
          python -m scripts.contracts
          node scripts/generate_types.mjs
          git diff --exit-code -- contracts/desktop.schema.json apps/desktop/src/contracts.ts
