# Optional development database. The desktop supervisor uses a separate private cluster.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ltt_dev
      POSTGRES_PASSWORD: ${LTT_DEV_DB_PASSWORD:?Set a local development password}
      POSTGRES_DB: ltt_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ltt-development:/var/lib/postgresql/data
volumes:
  ltt-development:
